spring:
  application:
    name: tarea-crud
  
  # Configuración de la base de datos H2 (desarrollo)
  datasource:
    url: jdbc:h2:mem:tareadb
    driver-class-name: org.h2.Driver
    username: sa
    password:
  
  # Configuración de JPA/Hibernate
  jpa:
    database-platform: org.hibernate.dialect.H2Dialect
    hibernate:
      ddl-auto: create-drop
    show-sql: true
    properties:
      hibernate:
        format_sql: true
  
  # Consola H2
  h2:
    console:
      enabled: true
      path: /h2-console

# Configuración del servidor
server:
  port: 8080
  servlet:
    context-path: /

# Logging
logging:
  level:
    root: INFO
    com.example.tarea: DEBUG
    org.springframework.web: DEBUG
    org.hibernate.SQL: DEBUG
